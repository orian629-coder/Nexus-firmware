# systemd-sysusers: create the dedicated, non-login service user for Nexus Speaker OS.
# Install to /usr/lib/sysusers.d/nexus-speaker.conf and run: systemd-sysusers
#
# The home dir is real (not /nonexistent): PipeWire/WirePlumber run as this user's *user* services
# (see scripts/setup-audio.sh) and read their config from ~/.config, so the user needs a writable
# home. linger (enabled by setup-audio.sh) lets those services start at boot without a login.
#
# Type Name           ID  GECOS                 Home              Shell
u     nexus-speaker   -   "Nexus Speaker OS"    /var/lib/nexus-speaker  /usr/sbin/nologin
m     nexus-speaker   audio
m     nexus-speaker   gpio
m     nexus-speaker   i2c
m     nexus-speaker   spi
m     nexus-speaker   bluetooth
