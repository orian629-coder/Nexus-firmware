# systemd-tmpfiles: create runtime directories with correct owners/modes.
# Install to /usr/lib/tmpfiles.d/nexus-speaker.conf and run: systemd-tmpfiles --create
#
# Type Path                             Mode  User           Group          Age Argument
d     /var/log/nexus-speaker           0750  nexus-speaker  nexus-speaker  -
d     /var/lib/nexus-speaker           0750  nexus-speaker  nexus-speaker  -
d     /var/lib/nexus-speaker/secure    0700  nexus-speaker  nexus-speaker  -
d     /var/lib/nexus-speaker/calibration 0750 nexus-speaker nexus-speaker  -
# The service owns its /etc dir so it can atomically rewrite config.json (temp+rename needs write
# access to the directory, not just the file) on SET_VOLUME/pairing/etc.
d     /etc/nexus-speaker               0755  nexus-speaker  nexus-speaker  -
# The identity directory holds factory data (factory.json, written 0444). The service owns the
# directory so it can provision the identity once on first boot; after that the file is read-only
# and the private key lives separately in /var/lib/nexus-speaker/secure.
d     /etc/nexus-speaker/identity      0755  nexus-speaker  nexus-speaker  -
